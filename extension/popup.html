<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
  <canvas id="kit" width="34" height="30" aria-hidden="true"></canvas>
  <div>
    <h1>Tab Bridge</h1>
    <p id="conn" class="muted">Checking…</p>
  </div>
</header>

<section>
  <h2>Organise with Claude</h2>
  <textarea id="instructions" rows="2" maxlength="500" placeholder="Anything specific? (optional)" aria-label="Anything specific for Claude (optional)"></textarea>
  <button id="organise" class="primary">Organise my tabs</button>
  <p class="muted small">Claude can group, move and rename. It can't close tabs.</p>
</section>

<section>
  <h2>Tidy up</h2>
  <button data-action="apply_rules">Apply my rules</button>
  <button data-action="group_by_site">Group loose tabs by website</button>
  <button data-action="sort_groups">Sort tabs in each group</button>
  <button data-action="collapse_all">Collapse all groups</button>
  <button id="dupes">Close duplicate tabs…</button>
  <div id="dupe-panel" hidden>
    <p id="dupe-msg" class="muted"></p>
    <ul id="dupe-list"></ul>
    <div class="row">
      <button id="dupe-close" class="primary">Close them</button>
      <button id="dupe-cancel">Cancel</button>
    </div>
  </div>
</section>

<section>
  <h2>My lists</h2>
  <div id="lists"></div>
  <p id="no-lists" class="muted" hidden>No lists yet. Make one under Rules &amp; lists.</p>
</section>

<p id="status" role="status"></p>

<footer>
  <button id="hi" class="link">Say hi</button>
  <button id="options" class="link">Rules &amp; lists</button>
</footer>
<script src="kit.js"></script>
<script src="popup.js"></script>
</body>
</html>
