<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="popup.css">
<link rel="stylesheet" href="result.css">
</head>
<body>
<header>
  <button id="kit-hi" class="avatar" title="Say hi" aria-label="Say hi to Kit"><canvas id="kit" width="34" height="30" aria-hidden="true"></canvas></button>
  <div class="who">
    <h1>Kit</h1>
    <p id="conn" class="muted">Checking…</p>
  </div>
  <div class="head-actions">
    <button id="hi" class="pill" title="Kit walks out and says hello">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M6 1h2v6h1V2h2v5h1V3h2v7l-1 4-2 2H7L3 12 1 8l1-1 3 2V2h1z"/></svg>
      Say hi
    </button>
    <button id="expand" class="icon-btn" title="Open Kit in a full tab" aria-label="Open Kit in a full tab">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M9.5 2.5h4v4M13.5 2.5 9 7M6.5 13.5h-4v-4M2.5 13.5 7 9"/></svg>
    </button>
  </div>
</header>

<section>
  <h2>Tidy up</h2>
  <button data-action="group_by_site">Group loose tabs by website <span class="count" id="n-group_by_site"></span></button>
  <button data-action="apply_rules">Apply my rules <span class="count" id="n-apply_rules"></span></button>
  <button data-action="sort_groups">Sort tabs in each group <span class="count" id="n-sort_groups"></span></button>
  <button data-action="collapse_all">Collapse all groups <span class="count" id="n-collapse_all"></span></button>
  <button id="dupes">Close duplicate tabs… <span class="count" id="n-dupes"></span></button>
  <div id="dupe-panel" hidden>
    <p id="dupe-msg" class="muted"></p>
    <ul id="dupe-list"></ul>
    <div class="row">
      <button id="dupe-close" class="primary">Close them</button>
      <button id="dupe-cancel">Cancel</button>
    </div>
  </div>
  <button id="undo" class="undo" hidden></button>
</section>

<section id="ai">
  <h2>Organise with AI</h2>
  <div id="organise-controls" hidden>
    <div class="agent-row">
      <label for="agent">With</label>
      <select id="agent" disabled><option value="">Checking assistants…</option></select>
    </div>
    <textarea id="instructions" rows="2" maxlength="500" placeholder="Anything specific? (optional)" aria-label="Anything specific for the AI (optional)"></textarea>
    <button id="organise" class="primary">Organise my tabs</button>
    <p id="organise-note" class="muted small">It can group, move and rename, but can't close tabs.</p>
  </div>
  <div id="setup-card" class="setup-card" hidden>
    <p class="setup-title" id="setup-title"></p>
    <p class="setup-text" id="setup-text"></p>
    <div class="setup-actions">
      <button id="setup" class="primary"></button>
      <button id="setup-later" class="link" hidden>Not now</button>
    </div>
  </div>
  <p id="setup-line" class="small muted" hidden>AI is optional. <button id="setup-show" class="link inline">Set it up</button></p>
  <div id="result" role="status" hidden></div>
</section>

<section>
  <h2>My lists</h2>
  <div id="lists"></div>
  <p id="no-lists" class="muted" hidden>No lists yet. Make one under Rules &amp; lists.</p>
</section>

<p id="status" role="status"></p>

<footer>
  <button id="options" class="link">Rules &amp; lists</button>
  <button id="expand-foot" class="link">Open full page</button>
</footer>
<script src="kit.js"></script>
<script src="result.js"></script>
<script src="popup.js"></script>
</body>
</html>
