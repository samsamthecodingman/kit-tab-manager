# Pushing a tag like v0.6.0 checks the extension and submits that version to addons.mozilla.org.
# Needs the repository secrets WEB_EXT_API_KEY and WEB_EXT_API_SECRET
# (addons.mozilla.org → Developer Hub → Tools → Manage API Keys).
name: Release to addons.mozilla.org

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tag matches the manifest version
        run: |
          version=$(jq -r .version extension/manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match manifest version $version" >&2
            exit 1
          fi

      - name: Lint
        run: npx --yes web-ext@10 lint --source-dir extension

      - name: Submit to addons.mozilla.org
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: npx --yes web-ext@10 sign --channel=listed --source-dir extension --artifacts-dir web-ext-artifacts
